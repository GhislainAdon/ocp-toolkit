name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: vet / test / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod declares the minimum (1.24); build with a supported toolchain
          go-version: '1.26'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

      - name: Cross-compile release binaries
        run: make release VERSION=${GITHUB_SHA::7}

      - uses: actions/upload-artifact@v4
        with:
          name: ocptk-binaries
          path: bin/
          retention-days: 7

  docker:
    name: image build + Trivy scan
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ocp-toolkit:ci

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ocp-toolkit:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Gate on our own layers (UBI base + ocptk). The upstream `oc` binary
          # copied from origin-cli is tracked separately (CVEs fixed upstream).
          skip-files: /usr/bin/oc
          exit-code: '1'
