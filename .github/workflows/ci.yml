name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: vet / test / lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1

      - name: Cross-compile release binaries
        run: make release VERSION=${GITHUB_SHA::7}

      - uses: actions/upload-artifact@v4
        with:
          name: ocptk-binaries
          path: bin/
          retention-days: 7

  docker:
    name: image build + Trivy scan
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ocp-toolkit:ci

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ocp-toolkit:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # report-only: the image embeds the upstream `oc` binary whose CVEs
          # are outside this project's control. Flip to '1' to gate merges.
          exit-code: '0'
